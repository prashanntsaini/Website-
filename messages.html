        <div class="ig-lsearch"><input class="cm-search" id="nq" type="search" placeholder="Search students to chat" maxlength="40" autocomplete="off"></div>

<script type="module">
  import { protectPage } from "./auth.js?v=30";
  import * as C from "./community.js?v=30";
  import { initLightbox } from "./media.js?v=30";
  import * as CALL from "./calls.js?v=30";
  import * as UP from "./uploads.js?v=30";
  const $ = id => document.getElementById(id);
  const { esc, F } = C;
  const ic = n => window.ic ? window.ic(n) : "";
  const profCache = {};
  let me, myProf, chats = [], cur = null /* {uid, prof, cid, group?, chat?} */, unsub = null, unsubG = null, msgs = [], lastSend = 0, pendFile = null, sending = false, replyTo = null, hidden = {}, gInfoPaint = null, lastTap = { id: "", t: 0 };
  const attCache = {};      // message id -> attachment html (so a re-render does not reload the file)
  initLightbox();
  $("newchat").innerHTML = ic("pencil");
  $("newgroup").innerHTML = ic("users");
  $("newgroup").addEventListener("click", () => newGroup());
  $("newchat").addEventListener("click", () => { $("nq").focus(); $("nq").scrollIntoView({ block: "nearest" }); });
  const backIc = '<span class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>';

  const fmt = ms => { const d = new Date(ms), t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { day: "numeric", month: "short" }) + " " + t; };

  const ago = ms => { if (!ms) return ""; const m = Math.floor((Date.now() - ms) / 60000); if (m < 1) return "now"; if (m < 60) return m + "m"; const h = Math.floor(m / 60); if (h < 24) return h + "h"; const d = Math.floor(h / 24); return d < 7 ? d + "d" : Math.floor(d / 7) + "w"; };
  function syncCompose() {
    const ta = $("txt"), c = $("compose"); if (!ta || !c) return;
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    c.classList.toggle("has-text", !!ta.value.trim() || !!pendFile);
  }
  // On phones the open chat covers the whole screen; keep it exactly as tall as the visible area (keyboard open / closed)
  function fitChat() {
    const vv = window.visualViewport, st = document.documentElement.style;
    if (document.body.classList.contains("msg-in-conv") && vv && vv.scale <= 1.01) { st.setProperty("--app-h", vv.height + "px"); st.setProperty("--app-top", vv.offsetTop + "px"); }
    else { st.removeProperty("--app-h"); st.removeProperty("--app-top"); }
    const box = $("msgs"); if (box && box.dataset.stick) box.scrollTop = box.scrollHeight;
  }
  new MutationObserver(fitChat).observe(document.body, { attributes: true, attributeFilter: ["class"] });
  if (window.visualViewport) { visualViewport.addEventListener("resize", fitChat); visualViewport.addEventListener("scroll", fitChat); }
  addEventListener("resize", fitChat);
  const sepFmt = ms => { const d = new Date(ms), t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === new Date().toDateString() ? "Today " + t : d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + t; };
  const firstName = n => String(n || "").trim().split(/\s+/)[0] || "Someone";
  const chatHidden = c => { const h = hidden[c.id]; return !!(h && h.clearedAt && h.clearedAt >= (c.lastTs || 0)); };
  async function loadList() {
    try { chats = (await C.listChats(me.uid)).filter(c => !chatHidden(c)); } catch (e) { $("list").innerHTML = `<div class="empty">${esc(C.errText(e))}</div>`; return; }
    const ps = await Promise.all(chats.map(c => C.isGroup(c) ? { name: c.name || "Group", group: true } : C.getProfile(C.otherOf(c, me.uid)).catch(() => null)));
    const lp = await Promise.all(chats.map(c => C.isGroup(c) && c.lastFrom && c.lastFrom !== me.uid && !c.lastSys ? C.getProfile(c.lastFrom).catch(() => null) : null));
    $("list").innerHTML = chats.length ? chats.map((c, i) => {
      const g = C.isGroup(c), o = g ? c.id : C.otherOf(c, me.uid), p = ps[i] || { name: "Student" }; profCache[o] = p;
      const un = C.isUnread(c, me.uid) && !(cur && cur.uid === o);
      const pre = c.lastFrom === me.uid && !c.lastSys ? "You: " : (g && lp[i] ? firstName(lp[i].name) + ": " : "");
      const ava = g ? `<span class="lp">${C.groupAvatarHtml(p, "sm")}</span>` : `<span class="lp" data-lp="${esc(o)}">${C.avatarHtml(p, "sm")}</span>`;
      return `<div class="cm-row ${cur && cur.uid === o ? "on" : ""} ${un ? "unread" : ""}" data-open="${esc(o)}">${ava}<div class="grow"><b>${esc(p.name)}${g ? "" : C.tk(o)}</b><small data-keep>${pre}${esc(c.lastText || "")}</small></div><span class="cm-time">${ago(c.lastTs)}</span>${un ? '<span class="cm-dot"></span>' : ""}</div>`;
    }).join("") : `<div class="empty">No conversations yet. Tap the people icon to make a group.</div>`;
  }

  function closeConv() {
    $("chat").classList.remove("in-conv"); document.body.classList.remove("msg-in-conv"); fitChat();
    if (unsub) { unsub(); unsub = null; } if (unsubG) { unsubG(); unsubG = null; }
    stopBg(); $("conv").classList.remove("has-bg"); $("conv").style.background = ""; cur = null; replyTo = null; gInfoPaint = null; UP.refresh(); loadList();
  }
  const isMember = (c, u) => !!c && (c.participants || []).includes(u);
  const groupSub = c => (c.participants || []).length + " people";
  const groupMenu = c => `<button id="g-info" type="button">${ic("users")} Group info</button>${(c.admins || []).includes(me.uid) && (c.participants || []).length < C.GROUP_MAX ? `<button id="g-add" type="button">${ic("plus")} Add people</button>` : ""}<button id="m-bg" type="button">${ic("sparkles")} Chat background</button><button id="m-clear" type="button">${ic("trash")} Delete chat for me</button><button id="g-leave" type="button">${ic("logout")} Leave group</button>`;
  function paintGroupHead() {
    if (!cur || !cur.group) return;
    const n = $("g-name"), sb = $("g-sub"), pop = $("pop"), av = $("g-ava");
    if (n) n.textContent = cur.prof.name; if (sb) sb.textContent = groupSub(cur.chat); if (av) av.innerHTML = C.groupAvatarHtml(cur.prof, "sm");
    if (pop) pop.innerHTML = groupMenu(cur.chat);
    if (gInfoPaint) gInfoPaint();
  }
  function watchGroup(gid) {
    if (unsubG) unsubG();
    unsubG = C.A.fsWatchDoc(["chats", gid], d => {
      if (!cur || cur.cid !== gid) return;
      if (!d || !isMember(d, me.uid)) { C.toast("You are no longer in this group.", 3500); closeConv(); return; }
      cur.chat = d; cur.prof = { name: d.name || "Group", group: true }; profCache[gid] = cur.prof;
      d.participants.filter(u => !profCache[u]).forEach(u => C.getProfile(u).then(p => { if (p) { profCache[u] = p; paintMsgs(); paintGroupHead(); } }).catch(() => {}));
      paintGroupHead();
    }, () => {});
  }

  async function open(otherUid) {
    if (unsub) { unsub(); unsub = null; }
    if (unsubG) { unsubG(); unsubG = null; }
    const isG = /^g_/.test(otherUid);
    replyTo = null; gInfoPaint = null;
    // the chat covers the whole screen straight away; the details are filled in as they arrive
    $("chat").classList.add("in-conv"); document.body.classList.add("msg-in-conv");
    stopBg(); $("conv").classList.remove("has-bg"); $("conv").style.background = "";
    $("conv").innerHTML = `<div class="cm-conv-head ig-head"><button class="ig-hb cm-back" id="back0" type="button" aria-label="Back">${backIc}</button></div><div class="cm-msgs"><div class="cm-empty">Opening chat...</div></div>`;
    $("back0").addEventListener("click", closeConv);
    let prof, chatDoc = null;
    if (isG) {
      chatDoc = await C.A.fsGetPath(["chats", otherUid]).catch(() => null);
      if (!chatDoc || !isMember(chatDoc, me.uid)) { $("chat").classList.remove("in-conv"); document.body.classList.remove("msg-in-conv"); C.toast("You are not in this group."); return; }
      await Promise.all(chatDoc.participants.map(u => C.getProfile(u).then(p => { if (p) profCache[u] = p; }).catch(() => {})));
      prof = { name: chatDoc.name || "Group", group: true };
    } else {
      prof = await C.getProfile(otherUid, true).catch(() => profCache[otherUid] || null);
      if (!prof) { $("chat").classList.remove("in-conv"); document.body.classList.remove("msg-in-conv"); C.toast("This student has no community profile."); return; }
    }
    profCache[otherUid] = prof;
    cur = { uid: otherUid, prof, cid: isG ? otherUid : C.chatId(me.uid, otherUid), group: isG, chat: chatDoc };
    msgs = []; watchBg();
    let blocked = false, exists = true, can = { ok: true };
    if (!isG) {
      const r = await Promise.all([C.isBlocked(me.uid, otherUid), C.chatExists(cur.cid)]); blocked = r[0]; exists = r[1];
      can = blocked ? { ok: false, why: "You blocked this student." } : await C.canMessage(me.uid, otherUid, prof).catch(() => ({ ok: true }));
    }
    fitChat();
    const pl = encodeURIComponent(otherUid);
    const head = isG
      ? `<div class="cm-conv-head ig-head"><button class="ig-hb cm-back" id="back" type="button" aria-label="Back">${backIc}</button>
        <a class="ig-ava lp" id="g-ava" href="#" aria-label="Group info">${C.groupAvatarHtml(prof, "sm")}</a>
        <a class="grow ig-who lp" id="g-who" href="#"><b id="g-name">${esc(prof.name)}</b><small id="g-sub">${groupSub(chatDoc)}</small></a>
        <div class="cm-menu"><button class="ig-hb" id="menu" type="button" aria-label="More options">${ic("more")}</button>
          <div class="cm-menu-pop" id="pop">${groupMenu(chatDoc)}</div></div></div>`
      : `<div class="cm-conv-head ig-head"><button class="ig-hb cm-back" id="back" type="button" aria-label="Back">${backIc}</button>
        <a class="ig-ava lp" data-lp="__cur" href="profile.html?u=${pl}">${C.avatarHtml(prof, "sm")}</a>
        <a class="grow ig-who lp" data-lp="__cur" href="profile.html?u=${pl}"><b>${esc(prof.name)}${C.tk(cur.uid)}</b><small>View profile</small></a>
        ${can.ok ? `<button class="ig-hb" id="call-a" type="button" aria-label="Voice call" title="Voice call">${ic("call")}</button><button class="ig-hb" id="call-v" type="button" aria-label="Video call" title="Video call">${ic("video")}</button>` : ""}
        <div class="cm-menu"><button class="ig-hb" id="menu" type="button" aria-label="More options">${ic("more")}</button>
          <div class="cm-menu-pop" id="pop">${can.ok ? `<button id="m-call-a" type="button">${ic("call")} Voice call</button><button id="m-call-v" type="button">${ic("video")} Video call</button>` : ""}<button id="m-profile" type="button">${ic("user")} View profile</button><button id="m-pic" type="button">${ic("image")} View profile picture</button><button id="m-share" type="button">${ic("share")} Share profile</button><button id="m-bg" type="button">${ic("sparkles")} Chat background</button><button id="m-clear" type="button">${ic("trash")} Delete chat for me</button><button id="m-report" type="button">${ic("flag")} Report</button><button id="m-block" type="button">${ic(blocked ? "check" : "ban")} ${blocked ? "Unblock" : "Block"}</button></div></div></div>`;
    $("conv").innerHTML = `
      ${head}
      <div class="cm-msgs" id="msgs"><div class="cm-empty">${exists ? "Loading..." : "Say hello 👋 Ask a study doubt or share notes."}</div></div>
      ${can.ok ? `<div class="mx-replybar" id="replybar" hidden></div><div class="cm-pend" id="pend" hidden></div>
        <div class="cm-compose ig" id="compose">
          <button class="ig-cam" id="cam" type="button" aria-label="Take a photo">${ic("camera")}</button>
          <textarea id="txt" maxlength="1000" placeholder="Message..." rows="1" enterkeyhint="send"></textarea>
          <button class="ig-ico" id="sched" type="button" aria-label="Schedule message" title="Schedule message"><span class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></button>
          <span class="ig-tools"><button class="ig-ico ig-gif" id="gif" type="button" aria-label="Send a GIF">GIF</button><button class="ig-ico" id="gal" type="button" aria-label="Photo or video">${ic("image")}</button><button class="ig-ico" id="attach" type="button" aria-label="Send a PDF, APK or any file">${ic("paperclip")}</button></span>
          <button class="ig-send" id="send" type="button">Send</button>
          <input type="file" id="file" hidden><input type="file" id="file-gal" accept="image/*,video/*" hidden><input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
        </div>`
               : `<div class="cm-compose"><div class="cm-msg" style="margin:0;flex:1;text-align:center">${esc(can.why || "You cannot message this student.")}</div></div>`}`;
    $("back").addEventListener("click", closeConv);
    $("menu").addEventListener("click", e => { e.stopPropagation(); $("pop").classList.toggle("open"); });
    const closePop = () => { const p = $("pop"); if (p) p.classList.remove("open"); };
    if (isG) {
      const info = e => { e.preventDefault(); openGroupInfo(); };
      $("g-ava").addEventListener("click", info); $("g-who").addEventListener("click", info);
      $("pop").addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return; closePop();
        if (b.id === "g-info") openGroupInfo(); else if (b.id === "g-add") addPeople(); else if (b.id === "m-bg") openBg();
        else if (b.id === "m-clear") clearChat(); else if (b.id === "g-leave") leaveNow();
      });
      watchGroup(cur.cid);
    } else {
      if (can.ok) {
        $("call-a").addEventListener("click", () => CALL.startCall(otherUid, "audio", prof));
        $("call-v").addEventListener("click", () => CALL.startCall(otherUid, "video", prof));
        $("m-call-a").addEventListener("click", () => { closePop(); CALL.startCall(otherUid, "audio", prof); });
        $("m-call-v").addEventListener("click", () => { closePop(); CALL.startCall(otherUid, "video", prof); });
      }
      $("m-block").addEventListener("click", async () => {
        closePop();
        try {
          if (blocked) { await C.unblockUser(me.uid, otherUid); C.toast("Unblocked", 2000); }
          else if (confirm("Block " + prof.name + "? They will not be able to message or follow you.")) { await C.blockUser(me.uid, otherUid); C.toast("Blocked", 2000); }
          else return;
          open(otherUid);
        } catch (e) { C.toast(C.errText(e), 6000); }
      });
      $("m-report").addEventListener("click", () => { closePop(); report(); });
      $("m-profile").addEventListener("click", () => { location.href = "profile.html?u=" + pl; });
      $("m-pic").addEventListener("click", () => { closePop(); C.viewPhoto(prof); });
      $("m-share").addEventListener("click", () => { closePop(); C.shareProfile(prof, otherUid); });
      $("m-bg").addEventListener("click", () => { closePop(); openBg(); });
      $("m-clear").addEventListener("click", () => { closePop(); clearChat(); });
    }
    applyBg();
    if (can.ok) {
      $("send").addEventListener("click", send);
      $("txt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
      $("attach").addEventListener("click", () => $("file").click());
      $("gal").addEventListener("click", () => $("file-gal").click());
      $("cam").addEventListener("click", () => $("file-cam").click());
      $("gif").addEventListener("click", openGif);
      $("sched").addEventListener("click", openSched);
      ["file", "file-gal", "file-cam"].forEach(id => $(id).addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) setPending(f); }));
      $("txt").addEventListener("input", syncCompose);
      $("txt").addEventListener("focus", () => setTimeout(() => { const b = $("msgs"); if (b) b.scrollTop = b.scrollHeight; }, 250));
      $("txt").addEventListener("paste", e => { const f = [...((e.clipboardData && e.clipboardData.files) || [])][0]; if (f) { e.preventDefault(); setPending(f); } });
    }
    pendFile = null; syncCompose(); UP.refresh(); if (UP.forChat(cur.cid).length) paintMsgs();
    if (exists) watch();
    loadList();
  }

  const visible = m => { const h = cur && hidden[cur.cid]; if (!h) return true; if (h.ids && h.ids[m.id]) return false; return !(h.clearedAt && (m.ts || 0) <= h.clearedAt); };
  function watch() {
    if (unsub) unsub();
    const cid = cur.cid;
    unsub = C.A.fsWatchCol(["chats", cid, "messages"], rows => {
      if (!cur || cur.cid !== cid) return;
      msgs = rows.filter(visible).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      paintMsgs();
      C.markSeen(cid, me.uid);
    }, e => { const b = $("msgs"); if (b) b.innerHTML = `<div class="cm-empty">${esc(C.errText(e))}</div>`; });
  }

  /* ---------- attachments ---------- */
  /* ---------- Instagram-style sending: the file shows in the chat at once, "Sending..." until it is delivered ---------- */
  const pvUrl = {};
  function pendBubbles() {
    if (!cur) return "";
    return UP.forChat(cur.cid).map(j => {
      const f = j.meta.file, k = j.kind, pct = Math.round(j.progress * 100), failed = j.state === "failed";
      pvUrl[j.id] = pvUrl[j.id] || URL.createObjectURL(f);
      let thumb;
      if (k === "image") thumb = `<img class="zoomable cm-img" src="${pvUrl[j.id]}" alt="">`;
      else if (k === "video") thumb = `<div class="up-vid"><video class="cm-vid" muted playsinline preload="metadata" src="${pvUrl[j.id]}#t=0.1"></video><span class="up-play">${ic("play")}</span></div>`;
      else thumb = `<div class="cm-file up-fcard">${ic("file")}<span><b data-keep>${esc(f.name)}</b><small>${F.fmtSize(f.size)}</small></span></div>`;
      const retry = failed ? ` data-upact="retry" data-id="${j.id}"` : "";
      return `<div class="cm-r mine single up-pend ${failed ? "failed" : ""}" data-pj="${j.id}"><div class="cm-bubble mine media"${retry}><div class="cm-att up-box">${thumb}${failed ? "" : `<span class="up-pbar"><i style="width:${pct}%"></i></span>`}</div>${j.meta.text ? `<span>${esc(j.meta.text)}</span>` : ""}<small class="up-st">${failed ? `<b class="up-bad">!</b> Not delivered · Tap to retry · <a href="#" data-upact="cancel" data-id="${j.id}">Delete</a>` : `<i class="up-spin"></i> Sending…`}</small></div></div>`;
    }).join("");
  }
  function paintMsgs() {
    const box = $("msgs"); if (!box) return;
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80, pb = pendBubbles();

  /* ---------- chat background: shared, so BOTH students see the same wallpaper ----------

  const BG_PRESETS = [
    ["Midnight", "#0b1020"], ["Graphite", "#1c1d22"], ["Forest", "linear-gradient(160deg,#0f2d24,#1d5b45)"], ["Ocean", "linear-gradient(160deg,#08203e,#1b6ca8)"],
    ["Sunset", "linear-gradient(160deg,#42275a,#e0636b)"], ["Violet", "linear-gradient(160deg,#1e1450,#6a4bd8)"], ["Rose", "linear-gradient(160deg,#4a1330,#c9486f)"], ["Sand", "#efe6d6"], ["Sky", "linear-gradient(160deg,#cfe8ff,#ffffff)"]
  ];
  const BG_ONE = () => "gyaan_chatbg_" + me.uid + "_" + cur.cid, BG_ALL = () => "gyaan_chatbg_all_" + me.uid;   // BG_ALL: old "all my chats" setting, still honoured
  const IMG_OK = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
  const bgRead = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const bgValid = b => {
    if (!b) return null;
    if (b.k === "img" && typeof b.v === "string" && IMG_OK.test(b.v)) return b;
    if (b.k === "css" && BG_PRESETS.some(p => p[1] === b.v)) return b;
    return null;
  };
  const bgPath = cid => ["chats", cid, "bg", "current"];
  let bgUnsub = null, sharedBg = null;
  function stopBg() { if (bgUnsub) { bgUnsub(); bgUnsub = null; } sharedBg = null; }
  function watchBg() {
    if (!cur) return;
    if (bgUnsub) { bgUnsub(); bgUnsub = null; }
    const cid = cur.cid; let first = true;
    try {
      bgUnsub = C.A.fsWatchDoc(bgPath(cid), d => {
        if (!cur || cur.cid !== cid) return;

        if (!first && d && d.by && d.by !== me.uid && (!prev || prev.k !== d.k || prev.v !== d.v)) C.toast(cur.prof.name + " changed the chat background", 3000);
        first = false;
        applyBg();
      }, () => {});
    } catch (e) {}
  }
  // priority: my private background for this chat > the shared one > my old "all chats" background
  function bgGet() {
    const mine = bgRead(BG_ONE());
    if (mine) return mine.k === "none" ? null : bgValid(mine);
    if (sharedBg && sharedBg.k !== "none") return bgValid(sharedBg);
    if (sharedBg && sharedBg.k === "none") return null;
    const all = bgRead(BG_ALL());
    return all && all.k !== "none" ? bgValid(all) : null;
  }
  // the picture covers the WHOLE chat screen (behind the rounded header, messages and message box)
  function applyBg(previewDim) {
    const box = $("conv"); if (!box) return;
    const b = bgGet();
    box.classList.toggle("has-bg", !!b);
    if (!b) { box.style.background = ""; return; }
    if (b.k === "img") { const d = Math.max(0, Math.min(70, +(previewDim != null ? previewDim : b.dim) || 0)) / 100; box.style.background = `linear-gradient(rgba(0,0,0,${d}),rgba(0,0,0,${d})) center/cover no-repeat, url("${b.v}") center/cover no-repeat`; }
    else box.style.background = b.v;
  }
  // the photo is shrunk so it fits in one Firestore document (under 900 KB)
  function bgFromFile(f) {
    return new Promise((res, rej) => {
      if (!/^image\//.test(f.type)) return rej(new Error("Please choose a photo."));
      const url = URL.createObjectURL(f), im = new Image();
      im.onload = () => {
        URL.revokeObjectURL(url);
        let side = 1080, out = "";
        for (let tries = 0; tries < 5; tries++) {
          const sc = Math.min(1, side / Math.max(im.width, im.height)), c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          let q = .78; out = c.toDataURL("image/jpeg", q);
          while (out.length > 700000 && q > .4) { q -= .1; out = c.toDataURL("image/jpeg", q); }
          if (out.length <= 700000) return res(out);
          side = Math.round(side * .75);
        }
        rej(new Error("This photo is too large. Try a smaller one."));
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Could not read that photo.")); };
      im.src = url;
    });
  }
  const bgLocalSave = obj => { try { localStorage.setItem(BG_ONE(), JSON.stringify(obj)); return true; } catch (e) { return false; } };
  // obj = { k: "none" } | { k: "css", v } | { k: "img", v, dim }
  async function bgSave(obj, onlyMe) {
    if (onlyMe) {
      if (!bgLocalSave(obj)) throw new Error("Could not save. The phone storage is full, try a smaller photo.");
      applyBg(); return;
    }
    try { localStorage.removeItem(BG_ONE()); } catch (e) {}      // a shared choice replaces my private one for this chat
    try {
      if (!cur.group) await C.ensureChat(me.uid, cur.uid);
      if (!bgUnsub) watchBg();
      await C.A.fsSetPath(bgPath(cur.cid), { ...obj, by: me.uid, ts: Date.now() }, false);
      sharedBg = { ...obj, by: me.uid, ts: Date.now() }; applyBg();
    } catch (e) {
      bgLocalSave(obj); applyBg();
      C.toast("Could not share the background, so it is saved only for you. (Publish the updated firestore.rules.)", 7000);

  function openBg() {

      <div class="cm-actions" style="margin:14px 0 6px"><button class="btn btn-ghost" id="bg-up" type="button">${ic("image")} Choose your own photo</button><input type="file" id="bg-file" accept="image/*" hidden></div>
      <div class="cm-field" id="bg-dw" ${b0 && b0.k === "img" ? "" : "hidden"}><label for="bg-dim">Darken photo</label><input id="bg-dim" type="range" min="0" max="70" step="5" value="${b0 && b0.k === "img" ? (+b0.dim || 0) : 20}"></div>
      <label class="check"><input type="checkbox" id="bg-me" ${bgRead(BG_ONE()) ? "checked" : ""}><span>Only for me (${esc(cur.prof.name)} will not see it)</span></label>
      <div class="cm-msg" id="bg-m"></div>
      <p class="gif-by" style="text-align:left">Without “Only for me”, the background is saved to this chat, so you and ${esc(cur.prof.name)} both see it, on every device.</p></div>`;
    document.body.appendChild(md);
    const q = id => md.querySelector("#" + id), close = () => md.remove(), onlyMe = () => q("bg-me").checked;
    const fail = err => { q("bg-m").className = "cm-msg err"; q("bg-m").textContent = err.message || "Could not use that."; };
    const clear = () => { q("bg-m").className = "cm-msg"; q("bg-m").textContent = ""; };

    q("bg-g").addEventListener("click", async e => {

      try { await bgSave(i < 0 ? { k: "none" } : { k: "css", v: BG_PRESETS[i][1] }, onlyMe()); } catch (err) { fail(err); }
    });
    q("bg-up").addEventListener("click", () => q("bg-file").click());
    q("bg-file").addEventListener("change", async e => {
      const f = e.target.files[0]; e.target.value = ""; if (!f) return;

      try { const v = await bgFromFile(f); q("bg-dw").hidden = false; await bgSave({ k: "img", v, dim: +q("bg-dim").value }, onlyMe()); clear(); }
      catch (err) { fail(err); }
    });
    q("bg-dim").addEventListener("input", () => applyBg(+q("bg-dim").value));          // live preview only
    q("bg-dim").addEventListener("change", async () => {                                // saved when the finger is lifted
      const b = bgGet(); if (!b || b.k !== "img") return;

      try {

        else await bgSave({ k: "img", v: b.v, dim }, false);

    });

        <p class="mx-sub">${groupSub(c)}${adm ? " · you are an admin" : ""}</p>
        ${adm && c.participants.length < C.GROUP_MAX ? `<button class="btn btn-ghost" id="gi-add" type="button">${ic("plus")} Add people</button>` : ""}
        <div class="mx-mem">${c.participants.map(u => { const p = profCache[u] || { name: "Student" }, isA = (c.admins || []).includes(u); return `<div class="mx-mrow"><span class="lp">${C.avatarHtml(p, "sm")}</span><div class="grow"><b data-keep>${u === me.uid ? "You" : esc(p.name)}</b></div>${isA ? `<span class="mx-badge">Admin</span>` : ""}${adm && u !== me.uid ? `<button class="mx-mm" data-mm="${esc(u)}" type="button" aria-label="Manage ${esc(p.name)}">${ic("more")}</button>` : ""}</div>`; }).join("")}</div>
        <div class="cm-msg" id="gi-m"></div>
        <button class="btn btn-ghost mx-danger" id="gi-leave" type="button">${ic("logout")} Leave group</button></div>`;
    };
    const close = () => { gInfoPaint = null; md.remove(); };
    gInfoPaint = () => { if (md.isConnected) paint(); };
    paint();
    md.addEventListener("click", async e => {
      if (e.target === md || e.target.closest(".cm-x")) return close();
      const msg = t => { const el = md.querySelector("#gi-m"); if (el) { el.className = "cm-msg err"; el.textContent = t; } };
      if (e.target.closest("#gi-save")) {
        const nm = md.querySelector("#gi-name").value.trim();
        if (nm === cur.chat.name) return;
        try { await C.renameGroup(cur.cid, me.uid, myProf.name, nm); } catch (x) { msg(x && x.code ? C.errText(x) : x.message); }
        return;
      }
      if (e.target.closest("#gi-add")) { addPeople(); return; }
      if (e.target.closest("#gi-leave")) { close(); leaveNow(); return; }
      const mm = e.target.closest("[data-mm]");
      if (mm) {
        const u = mm.dataset.mm, nm = (profCache[u] && profCache[u].name) || "Student", isA = (cur.chat.admins || []).includes(u);
        sheetList(nm, [
          [isA ? "Remove as admin" : "Make admin", () => C.setGroupAdmin(cur.cid, cur.chat, u, !isA).catch(x => C.toast(C.errText(x), 5000)), false, "badge"],
          ["Remove from group", () => C.removeMember(cur.cid, cur.chat, me.uid, myProf.name, u, nm).catch(x => C.toast(C.errText(x), 5000)), true, "ban"]
        ]);
      }
    });
    document.body.appendChild(md);
  }

  /* long-press / right-click on a message opens the same menu; swipe a message sideways to reply (touch) */
  C.onLongPress(document, ".cm-r[data-row] .cm-bubble", el => { const r = el.closest("[data-row]"); openActions(msgs.find(x => x.id === r.dataset.row)); });
  document.addEventListener("contextmenu", e => { const b = e.target.closest && e.target.closest(".cm-r[data-row] .cm-bubble"); if (!b) return; e.preventDefault(); openActions(msgs.find(x => x.id === b.closest("[data-row]").dataset.row)); });
  let sw = null;
  document.addEventListener("touchstart", e => {
    const r = e.target.closest && e.target.closest(".cm-r[data-row]");
    if (!r || e.touches.length !== 1 || e.target.closest("video,audio,input,textarea")) { sw = null; return; }
    sw = { r, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: false };
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if (!sw.lock) { if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; } if (Math.abs(dx) > 12) sw.lock = true; else return; }
    sw.dx = Math.max(-80, Math.min(80, dx)); sw.r.style.transform = `translateX(${sw.dx}px)`;
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (!sw) return; const { r, dx, lock } = sw; sw = null;
    r.style.transition = "transform .2s"; r.style.transform = ""; setTimeout(() => { r.style.transition = ""; }, 230);
    if (lock && Math.abs(dx) >= 56) { const m = msgs.find(x => x.id === r.dataset.row); if (m && !m.deleted && !m.sys && !m.call) setReply(m); }
  }, { passive: true });
  document.addEventListener("touchcancel", () => { if (sw) { sw.r.style.transform = ""; sw = null; } }, { passive: true });

  C.onLongPress(document, "[data-lp]", el => { const id = el.dataset.lp; C.viewPhoto(id === "__cur" ? (cur && cur.prof) : profCache[id]); });
  C.onLongPress(document, "#send", () => openSendMenu());

  document.addEventListener("click", e => {
    const cb = e.target.closest("[data-callback]");
    if (cb && cur) { CALL.startCall(cur.uid, cb.dataset.callback, cur.prof); return; }
    const bub = e.target.closest(".cm-bubble");
    if (bub && !e.target.closest("a,button,video,audio,img")) {
      bub.classList.toggle("showt");
      const rw = bub.closest("[data-row]");
      if (rw) {                                   // double tap = heart (like Instagram)
        const now = Date.now();
        if (lastTap.id === rw.dataset.row && now - lastTap.t < 320) { lastTap = { id: "", t: 0 }; const m = msgs.find(x => x.id === rw.dataset.row); if (m && !m.deleted && !m.sys && !m.call) doReact(m, "❤️"); }
        else lastTap = { id: rw.dataset.row, t: now };
      }
    }
    const mo = e.target.closest("[data-more]");
    if (mo) { e.stopPropagation(); openActions(msgs.find(x => x.id === mo.dataset.more)); return; }
    const qb = e.target.closest("[data-qid]");
    if (qb) { jumpTo(qb.dataset.qid); return; }
    const rch = e.target.closest("[data-react-chip]");
    if (rch) { const m = msgs.find(x => x.id === rch.dataset.reactChip); if (m) openReactions(m); return; }
    const pop = $("pop"); if (pop && !e.target.closest(".cm-menu")) pop.classList.remove("open");
    const r = e.target.closest("[data-open]"); if (r) { open(r.dataset.open).catch(err => C.toast(C.errText(err) || "Could not open this chat.", 5000)); $("nq").value = ""; $("nres").innerHTML = ""; }
  });

  protectPage(async (user, demo) => {
    me = user; setTimeout(runSched, 1500);
    import("./accounts-ui.js?v=30").then(m => {
      const nm = m.currentAccountName(); if (nm) $("accname").textContent = nm;
      $("accbtn").addEventListener("click", m.openAccountSheet);
    });
    if (demo || C.A.isDemo()) { $("list").innerHTML = `<div class="empty">Messages need a real account (not demo mode).</div>`; return; }
    try {
      myProf = (await C.ensureMyProfile(user)).profile;
      hidden = await C.hiddenAll(user.uid);
      await loadList();
      const to = new URLSearchParams(location.search).get("to");
      if (to && to !== user.uid) await open(to).catch(err => C.toast(C.errText(err) || "Could not open this chat.", 5000));
      setInterval(() => { if (!document.hidden) loadList(); }, 20000);
    } catch (e) { $("list").innerHTML = `<div class="empty">${esc(C.errText(e))}</div>`; }
  });
</script>
<script type="module" src="layout.js?v=30"></script>
</body>
</html>
