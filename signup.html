<!DOCTYPE html>
<html lang="en">
<head>
  <script src="clean-url.js?v=29"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Gyaan Hub</title>
<meta name="description" content="Create your free Gyaan Hub account for notes, papers and mock tests.">
<link rel="canonical" href="https://prashantsaini.runs-on.dev/signup">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#5a4bda">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gyaan Hub">
<meta property="og:title" content="Sign Up | Gyaan Hub">
<meta property="og:description" content="Create your free Gyaan Hub account for notes, papers and mock tests.">
<meta property="og:url" content="https://prashantsaini.runs-on.dev/signup">
<meta property="og:image" content="https://prashantsaini.runs-on.dev/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gyaan Hub - notes, previous year papers, video lectures and mock tests">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign Up | Gyaan Hub">
<meta name="twitter:description" content="Create your free Gyaan Hub account for notes, papers and mock tests.">
<meta name="twitter:image" content="https://prashantsaini.runs-on.dev/og-image.png">
<link rel="stylesheet" href="style.css?v=29">
<script src="site-config.js?v=29"></script>
<script src="theme.js?v=29"></script>
<script src="icons.js?v=29"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <h1>Create account</h1>
    <p class="sub">It is free. Fill the details below.</p>
    <div id="add-banner" class="acc-banner" hidden><span data-i18n="acc.adding">Adding another account. Sign in or sign up with a different email.</span> <a href="#" id="add-cancel" data-i18n="acc.cancel">Cancel</a></div>
    <div id="msg" class="msg"></div>
    <form id="form">
      <div class="field"><label for="name">Full name</label><input id="name" name="fullname" type="text" placeholder="Your full name" required minlength="2" autocomplete="name"></div>
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email"></div>
      <div class="field"><label for="password">Password (min 6 characters)</label><input id="password" name="password" type="password" placeholder="••••••••" required minlength="6" autocomplete="new-password"></div>
      <button class="btn btn-gold btn-block" type="submit">Create Account</button>
      <p class="cs-hint">Next we verify your email. Then you confirm the <a href="terms.html" target="_blank" rel="noopener">Terms of Use</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
    </form>
    <div class="divider">OR</div>
    <button id="google" class="btn btn-ghost btn-block" type="button">
      <img class="gicon" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Continue with Google
    </button>
    <p class="alt">Already have an account? <a href="login.html">Sign In</a></p>
    <p class="alt"><a href="index.html" style="color:var(--muted);font-weight:500">Back to home</a></p>
  </div>
</div>
<script>
  // Fallback: runs only if auth.js failed to load (for example when opened as file://)
  document.getElementById("form").addEventListener("submit", function (e) {
    if (window.__authReady) return;
    e.preventDefault();
    var m = document.getElementById("msg");
    m.className = "msg err";
    m.textContent = location.protocol === "file:"
      ? "This page must be opened through a web server or your hosted URL, not as a local file. Run: python3 -m http.server 8000"
      : "Could not load auth.js. Make sure auth.js is uploaded next to this file, then refresh.";
  });
</script>
<script type="module">
  import { setupSignup, isAddingAccount, cancelAddAccount } from "./auth.js?v=29";
  setupSignup();
  if (isAddingAccount()) {
    document.getElementById("add-banner").hidden = false;
    document.getElementById("add-cancel").addEventListener("click", e => { e.preventDefault(); cancelAddAccount(); });
  }
</script>
<script type="module" src="layout.js?v=29"></script>
</body>
</html>
