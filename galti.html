<!DOCTYPE html>
<html lang="en">
<head>
  <script src="clean-url.js?v=30"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mistake Cards | Gyaan Hub</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#5a4bda">
<link rel="stylesheet" href="style.css?v=30">
<script src="site-config.js?v=30"></script>
<script src="theme.js?v=30"></script>
<script src="ads.js?v=30"></script>
<script src="icons.js?v=30"></script>
</head>
<body>
<main class="container" style="padding:20px 16px 110px;max-width:640px">
  <p><a href="dashboard.html">‹ Dashboard</a></p>
  <h1>📌 Mistake Cards</h1><p id="info"></p><div id="stats"></div><div id="box"></div>
</main>
<script src="site-config.js?v=30"></script><script src="theme.js?v=30"></script><script src="icons.js?v=30"></script>
<script type="module">
  import { protectPage } from "./auth.js?v=30";
  import { load, dueCards, mastered, showCard } from "./galti.js?v=30";
  const info = document.getElementById("info"), box = document.getElementById("box"), stats = document.getElementById("stats");
  let queue = [], total0 = 0;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function paint() {
    const total = Object.keys(load()).length, due = dueCards().length, m = mastered();
    const pct = total + m ? Math.round(m / (total + m) * 100) : 0;
    info.textContent = total ? `${total} card${total > 1 ? "s" : ""} to learn, ${due} due today.` : "No cards yet. Take a test and your wrong answers will appear here.";
    stats.innerHTML = total + m ? `<div class="mc-stats"><div><b>${total}</b><small>Total</small></div><div><b>${due}</b><small>Due today</small></div><div><b>${m}</b><small>Mastered</small></div></div><div class="mc-prog" title="${pct}% mastered"><i style="width:${pct}%"></i></div>` : "";
    return { total, due };
  }
  function menu() {
    const { total, due } = paint();
    box.innerHTML = total ? `<button class="btn btn-gold btn-block" id="mc-go">${due ? "Practice due cards (" + due + ")" : "Practice anyway"}</button><button class="btn btn-ghost btn-block" id="mc-all" style="margin-top:10px">Shuffle all cards</button>` : "";
    if (!total) return;
    document.getElementById("mc-go").onclick = () => { queue = dueCards(); if (!queue.length) queue = shuffle(Object.values(load())); total0 = queue.length; next(); };
    document.getElementById("mc-all").onclick = () => { queue = shuffle(Object.values(load())); total0 = queue.length; next(); };
  }
  function next() {
    const c = queue.shift();
    if (!c) { if (total0) { menu(); info.textContent = "Session complete. Nice work! " + info.textContent; total0 = 0; } else menu(); return; }
    info.textContent = `Card ${total0 - queue.length} of ${total0}`;
    showCard(box, c, next);
  }
  protectPage(menu);
</script>
<script type="module" src="layout.js?v=30"></script>
</body></html>
