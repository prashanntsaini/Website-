<!DOCTYPE html>
<html lang="en">

<body>
<header class="nav">
  <div class="container">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <div class="nav-cta">
      <span id="who" style="color:var(--muted);font-size:17px"></span>
      <button id="logout" class="btn btn-ghost">Logout</button>
    </div>
  </div>
</header>

<main class="dash">
  <div class="container">
    <h1><span data-i18n="dash.welcome">Welcome,</span> <span class="gold" id="name">student</span></h1>
    <p class="sub" data-i18n="dash.sub">What would you like to study today? Pick your material below.</p>
    <div id="demo" class="msg"></div>
    <div id="new-banner" class="banner" style="display:none"></div>
    <div id="cont-box" style="display:none">
      <h2 style="font-size:24px;margin:8px 0 14px"><span data-i18n="dash.continue">Continue learning</span></h2>
      <div id="cont-list" class="grid g3" style="margin-bottom:34px"></div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" data-i18n-ph="dash.search" placeholder="Search by title or subject, e.g. Calculus, Physics, DBMS...">
    </div>
    <div class="toolbar" style="margin-top:0" id="chips">
      <button class="chip on" data-f="all" data-i18n="dash.all">All</button>
      <button class="chip" data-f="Notes" data-i18n="dash.notes">Notes</button>
      <button class="chip" data-f="Papers" data-i18n="dash.papers">Papers</button>
      <button class="chip" data-f="Video" data-i18n="dash.videos">Videos</button>
      <button class="chip" data-f="Test" data-i18n="dash.mock">Mock Tests</button>
    </div>
    <p class="count" id="count"></p>

    <nav id="crumbs" class="crumbs" style="display:none" aria-label="Breadcrumb"></nav>
    <div id="view"></div>
    <div id="ad-dash" class="ad-slot" style="display:none"></div>
    <div id="empty" class="empty" style="display:none" data-i18n="dash.empty">No results found. Try a different search term or filter.</div>
  </div>
</main>

<script type="module">
  import { protectPage, logout, fsListFresh, cacheGet, listProgress, toMs } from "./auth.js?v=30";
  import { materials as sample, iconFor } from "./materials.js?v=30";
  import { getPrefs } from "./prefs.js?v=30";
  import { t, applyI18n } from "./i18n.js?v=30";
  import { isSafeUrl } from "./player-utils.js?v=30";

  let materials = sample, tests = [];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const safe = u => isSafeUrl(u) ? esc(u) : "#";
  const playerHref = (link, title, type) => "player.html?u=" + encodeURIComponent(link) + "&title=" + encodeURIComponent(title) + "&type=" + encodeURIComponent(type || "");
  const NEW_MS = 7 * 86400000;
  const tr = (k, fb) => { const v = t(k); return v === k ? fb : v; };
  const ico = n => (window.ic ? window.ic(n) : "");

  /* ---------- names, classes, chapters ---------- */
  const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
  const KEY = s => String(s ?? "").trim().toLowerCase().replace(/\s+/g, " ");
  const ALIAS = { maths: "mathematics", math: "mathematics", bio: "biology", phy: "physics", chem: "chemistry", cs: "computer science" };
  const subjKey = s => { const k = KEY(s) || "general"; return ALIAS[k] || k; };
  const titleCase = s => s.replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
  // "BIOLOGY" and "Biology" are one subject; show the nicest spelling that was used most
  function niceName(list) {
    const cnt = {}; list.forEach(x => { x = x.trim(); cnt[x] = (cnt[x] || 0) + 1; });
    const uniq = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
    const mixed = uniq.find(x => /[a-z]/.test(x) && /[A-Z]/.test(x));
    if (mixed) return mixed;
    const raw = uniq[0] || "General";
    return raw.length <= 4 ? raw.toUpperCase() : titleCase(raw);
  }
  const SUBJ_ICON = { biology: "leaf", physics: "atom", chemistry: "flask", mathematics: "divide", "computer science": "laptop" };
  const clsKey = c => {
    const s = KEY(c).replace(/^class\s*/, "");
    if (!s) return "general";
    if (/^\d{1,2}(st|nd|rd|th)?$/.test(s)) return String(parseInt(s, 10));
    return s === "other" ? "other" : s;
  };
  const clsLabel = k => k === "general" ? tr("dash.general", "General") : k === "other" ? tr("dash.other", "Other") : /^\d+$/.test(k) ? tr("dash.class", "Class") + " " + k : titleCase(k);
  const clsOrder = k => /^\d+$/.test(k) ? +k : k === "other" ? 100 : k === "general" ? 200 : 150;

  /* ---------- one flat list of everything (online tests + study material) ---------- */
  function allItems() {
    const out = [];
    const alerts = getPrefs().newAlerts;
    tests.forEach(x => out.push({
      kind: "test", title: x.title || "Test", subj: x.subject, cls: x.cls ?? x.class, ch: x.chapter, type: "Test",
      href: "tests.html?start=" + encodeURIComponent(x.id), direct: false, icon: iconFor("Test"),
      extra: x.questions.length + " questions" + (x.minutes ? " · " + x.minutes + " min" : ""), tag: t("dash.start"),
      created: toMs(x.createdAt), alerts
    }));
    materials.forEach(m => {
      const direct = m.type === "Test" || m.external || !isSafeUrl(m.link);
      out.push({
        kind: "mat", title: m.t, subj: m.s, cls: m.cls, ch: m.ch, type: m.type,
        href: direct ? safe(m.link) : playerHref(m.link, m.t, m.type), direct, icon: m.icon,
        extra: "", tag: m.type, created: m.created, alerts
      });
    });
    return out;
  }
  const card = (it, showSubj) => {
    const isNew = it.alerts && it.created && Date.now() - it.created < NEW_MS;
    const small = [it.sname, it.extra].filter(Boolean).join(" · ");
    return `
      <a class="card" href="${it.href}" ${it.direct ? 'target="_blank" rel="noopener"' : ""}>
        <div class="ico">${it.icon}</div>
        <h3>${esc(it.title)}${isNew ? `<span class="new-badge">${t("dash.new")}</span>` : ""}</h3>
        <div class="mat"><small>${esc(small)}</small><span class="tag" style="margin:0">${esc(it.tag)}</span></div>
      </a>`;
  };
  const counts = items => {
    const nt = items.filter(i => i.kind === "test").length, nm = items.length - nt, p = [];
    if (nt) p.push(nt + " " + (nt === 1 ? tr("dash.test1", "test") : tr("dash.tests", "tests")));
    if (nm) p.push(nm + " " + (nm === 1 ? tr("dash.mat1", "material") : tr("dash.mats", "materials")));
    return p.join(" · ");
  };

  /* ---------- group: subject > class > chapter ---------- */
  function build(items) {
    const subs = new Map();
    items.forEach(it => {
      const sk = subjKey(it.subj);
      let S = subs.get(sk);
      if (!S) subs.set(sk, S = { key: sk, names: [], items: [], classes: new Map() });
      S.names.push(String(it.subj || "General")); S.items.push(it);
      const ck = clsKey(it.cls);
      let C = S.classes.get(ck);
      if (!C) S.classes.set(ck, C = { key: ck, items: [] });
      C.items.push(it);
    });
    subs.forEach(S => { S.name = niceName(S.names); S.items.forEach(it => { it.sname = S.name; }); });
    return subs;
  }
  function chapters(items) {
    const m = new Map();
    items.forEach(it => {
      const k = KEY(it.ch);
      let c = m.get(k);
      if (!c) m.set(k, c = { key: k, names: [], items: [] });
      if (it.ch) c.names.push(String(it.ch));
      c.items.push(it);
    });
    const list = [...m.values()].map(c => ({ ...c, name: c.key ? niceName(c.names) : tr("dash.noChapter", "General") }));
    list.forEach(c => c.items.sort((a, b) => coll.compare(a.title, b.title)));
    return list.sort((a, b) => (a.key ? 0 : 1) - (b.key ? 0 : 1) || coll.compare(a.name, b.name));   // chapters A-Z, unnamed last
  }

  /* ---------- screen ---------- */
  let filter = "all", q = "";
  const view = document.getElementById("view"), crumbs = document.getElementById("crumbs"), adDash = document.getElementById("ad-dash"), empty = document.getElementById("empty"), count = document.getElementById("count");
  const hashState = () => { const h = new URLSearchParams(location.hash.replace(/^#/, "")); return { s: h.get("s") || "", c: h.get("c") || "" }; };
  const hs = (s, c) => "#s=" + encodeURIComponent(s) + (c ? "&c=" + encodeURIComponent(c) : "");
  const blockCard = (href, icon, name, items, hint) => `
      <a class="card subj-card" href="${href}">
        <div class="ico">${icon}</div>
        <h3>${esc(name)}</h3>
        <div class="mat"><small>${esc(counts(items) || hint || "")}</small><span class="tag" style="margin:0">${tr("dash.open", "Open")}</span></div>
      </a>`;

  function render() {
    const all = allItems().filter(it => filter === "all" || it.type === filter);
    const subs = build(all);
    const needle = q.trim().toLowerCase();
    let shown = all, showAd = false, html = "", cr = "", total = all.length;

    if (needle) {                                   // searching: one flat A-Z list across everything
      shown = all.filter(it => (it.title + " " + it.sname + " " + (it.ch || "") + " " + clsLabel(clsKey(it.cls))).toLowerCase().includes(needle));
      total = shown.length; showAd = shown.length > 0;
      shown.sort((a, b) => coll.compare(a.title, b.title));
      html = shown.length ? `<div class="grid g3">${shown.map(it => card(it, true)).join("")}</div>` : "";
    } else {
      const st = hashState();
      const S = st.s ? subs.get(st.s) : null;
      if (!S) {                                     // level 1: one block per subject
        const list = [...subs.values()].sort((a, b) => (a.key === "general" ? 1 : 0) - (b.key === "general" ? 1 : 0) || coll.compare(a.name, b.name));
        html = list.length ? `<h2 class="view-h">${tr("dash.pickSubject", "Choose a subject")}</h2><div class="grid g3">${list.map(x => blockCard(hs(x.key), ico(SUBJ_ICON[x.key] || "book"), x.name, x.items)).join("")}</div>` : "";
      } else {
        const home = `<a href="#">${tr("dash.allSubjects", "All subjects")}</a><span>›</span>`;
        const cl = [...S.classes.values()].sort((a, b) => clsOrder(a.key) - clsOrder(b.key));
        const only = cl.length === 1 && cl[0].key === "general" ? cl[0] : null;   // nothing classified yet: skip the class step
        const C = only || (st.c ? S.classes.get(st.c) : null);
        if (!C) {                                   // level 2: class-wise division
          total = S.items.length;
          cr = home + `<b>${esc(S.name)}</b>`;
          html = `<h2 class="view-h">${esc(S.name)}</h2><p class="view-sub">${tr("dash.pickClass", "Choose your class")}</p><div class="grid g3">${cl.map(c => blockCard(hs(S.key, c.key), ico("cap"), clsLabel(c.key), c.items)).join("")}</div>`;
        } else {                                    // level 3: chapters A-Z, content A-Z inside each chapter
          total = C.items.length; showAd = true;
          cr = home + (only ? "" : `<a href="${hs(S.key)}">${esc(S.name)}</a><span>›</span>`) + `<b>${only ? esc(S.name) : esc(clsLabel(C.key))}</b>`;
          html = `<h2 class="view-h">${esc(S.name)}${only ? "" : " · " + esc(clsLabel(C.key))}</h2>` + chapters(C.items).map(ch => `
            <section class="chap"><h3 class="chap-h"><span>${esc(ch.name)}</span><small>${ch.items.length}</small></h3>
            <div class="grid g3">${ch.items.map(it => card(it, false)).join("")}</div></section>`).join("");
        }
      }
    }

    view.innerHTML = html;
    crumbs.style.display = cr ? "flex" : "none"; crumbs.innerHTML = cr;
    adDash.style.display = showAd ? "flex" : "none";
    if (showAd && window.GyaanAds) GyaanAds.banner(adDash);   // built once, not on every search/filter
    empty.style.display = total ? "none" : "block";
    count.textContent = total + " " + (total === 1 ? t("dash.one") : t("dash.many"));
    const nn = getPrefs().newAlerts ? all.filter(i => i.created && Date.now() - i.created < NEW_MS).length : 0;
    const nb = document.getElementById("new-banner");
    nb.style.display = nn ? "flex" : "none"; nb.innerHTML = nn ? "🆕 <span><b>" + nn + "</b> " + t("dash.newBanner") + "</span>" : "";
  }

  /* ---------- data ---------- */
  const setTests = rows => { tests = (rows || []).filter(x => x.active !== false && Array.isArray(x.questions) && x.questions.length); };
  const applyMaterials = rows => {
    const r = (rows || []).filter(x => x.active !== false);
    if (r.length) materials = r.map(x => ({ t: x.t, s: x.s, cls: x.cls, ch: x.chapter, type: x.type, icon: iconFor(x.type), link: x.link, external: x.external === true, created: toMs(x.createdAt) }));
    return r.length > 0;
  };
  async function loadTests() { try { setTests(await fsListFresh("tests")); render(); } catch (e) { /* keep what is shown */ } }
  async function loadMaterials() { try { applyMaterials(await fsListFresh("materials")); } catch (e) { /* keep what is shown */ } }

  document.getElementById("search").addEventListener("input", e => { q = e.target.value; render(); });
  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  });
  window.addEventListener("hashchange", () => { render(); const top = document.getElementById("count"); if (top) top.scrollIntoView({ block: "start" }); });
  document.getElementById("logout").addEventListener("click", logout);

  // "Continue learning": what you opened last (this device at once, then your account)
  function showContinue(rows) {
    const r = (rows || []).filter(x => x && x.url && isSafeUrl(x.url) && x.pct > 1 && x.pct < 97).sort((a, b) => (b.updatedMs || b.ts || 0) - (a.updatedMs || a.ts || 0)).slice(0, 3);
    document.getElementById("cont-box").style.display = r.length ? "block" : "none";
    document.getElementById("cont-list").innerHTML = r.map(x => `
      <a class="card has-prog" href="${esc(playerHref(x.url, x.title || "Study material", x.type))}">
        <div class="ico">${iconFor(x.type)}</div><h3>${esc(x.title || "Study material")}</h3>
        <div class="mat"><small>${esc(x.type || "")} · ${x.pct}%</small><span class="tag" style="margin:0">${t("dash.resume")}</span></div>
        <div class="cont-bar"><i style="width:${x.pct}%"></i></div>
      </a>`).join("");
  }
  async function loadContinue(uid) {
    const local = [];
    try { Object.keys(localStorage).filter(k => k.startsWith("gyaan_prog_" + uid + "_")).forEach(k => local.push(JSON.parse(localStorage.getItem(k)))); } catch (e) {}
    showContinue(local);
    try {
      const remote = await listProgress();
      const byUrl = {};
      [...local, ...remote].forEach(x => { if (x && x.url) { const t0 = x.updatedMs || x.ts || toMs(x.updatedAt); if (!byUrl[x.url] || t0 > (byUrl[x.url].updatedMs || byUrl[x.url].ts || 0)) byUrl[x.url] = { ...x, updatedMs: t0 }; } });
      showContinue(Object.values(byUrl));
    } catch (e) { /* offline: keep the local list */ }
  }
  window.addEventListener("prefs-changed", () => { applyI18n(); render(); });

  protectPage((user, demo) => {
    const n = (user.displayName || user.email.split("@")[0]);
    document.getElementById("name").textContent = n;
    document.getElementById("who").textContent = user.email;
    if (demo) {
      const d = document.getElementById("demo");
      d.className = "msg ok";
      d.textContent = "Demo mode: real login will start working as soon as you add your Firebase config in auth.js.";
    }
    // show the last known lists instantly, then refresh them
    const cm = cacheGet("materials"), ct = cacheGet("tests");
    setTests(ct);
    if ((cm && applyMaterials(cm)) || tests.length) render();
    else view.innerHTML = '<div class="grid g3"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
    loadMaterials().then(render);
    loadTests();
    loadContinue(user.uid);
    applyI18n();
  });
</script>
<script type="module" src="layout.js?v=30"></script>
<script type="module">
  import { dueCards } from "./galti.js?v=30";
  import { mountTodayCard } from "./stats.js?v=30";
  const m = document.querySelector("main .container") || document.querySelector(".container");
  if (m) {
    m.insertAdjacentHTML("afterbegin", `<div id="gs-host"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px"><a class="btn btn-gold" href="galti.html">📌 Mistake Cards (${dueCards().length} due)</a><a class="btn btn-ghost" href="rapid.html">⚡ Rapid Fire</a></div>`);
    mountTodayCard(document.getElementById("gs-host"));
  }
</script>
</body>
</html>
