<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <div id="otp-step">
    <h1>Verify your email</h1>
    <p class="sub" id="sub">Preparing your verification code...</p>
    <div id="msg" class="msg"></div>
    <form id="form">
      <div class="field">
        <label for="code">6-digit verification code</label>
        <input id="code" class="otp-input" type="text" inputmode="numeric" pattern="[0-9]{6}" placeholder="······" autocomplete="one-time-code" required>
      </div>
      <button class="btn btn-ghost btn-block" type="button" id="paste" style="margin-bottom:12px">📋 Paste code from clipboard</button>
      <button class="btn btn-gold btn-block" type="submit" id="verify">Verify</button>
    </form>
    <p class="alt">Didn't get the email? <button type="button" class="linkbtn" id="resend" disabled>Resend code</button></p>
    <p class="alt" style="margin-top:10px">Check your spam folder too. The code is valid for 10 minutes.</p>
    <p class="alt" style="font-size:.72rem;opacity:.6">build 8</p>
    <p class="alt"><a href="#" id="logout" style="color:var(--muted);font-weight:500">Use a different account</a></p>
    </div>

    <!-- Step 2: confirm Terms of Use + Privacy Policy (shown after the code, or after Google sign-in) -->
    <div id="consent-step" hidden>
      <div class="cs-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
      <h1>One last step</h1>
      <p class="sub">Please confirm both to finish signing in<span id="c-who"></span>.</p>
      <div id="cmsg" class="msg"></div>
      <label class="cs-row">
        <input type="checkbox" id="c-terms"><i class="cs-box"></i>
        <span class="cs-txt"><b>Terms of Use</b><small>I have read and agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Use</a>.</small></span>
      </label>
      <label class="cs-row">
        <input type="checkbox" id="c-privacy"><i class="cs-box"></i>
        <span class="cs-txt"><b>Privacy Policy</b><small>I have read and agree to the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</small></span>
      </label>
      <button class="btn btn-gold btn-block" type="button" id="c-go" disabled>Agree &amp; continue</button>
      <p class="alt"><a href="#" id="c-out" style="color:var(--muted);font-weight:500">Cancel and sign out</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { onUser, isVerified, markVerified, logout, takeNext, consentOk, giveConsent } from "./auth.js?v=21";

  // ---- EmailJS settings ----
  const EMAILJS = {
    serviceId: "service_cvlhnic",
    templateId: "template_z5d6d7s",
    publicKey: "Lrc2aesJF7DoGwr56"   // EmailJS > Account > General > Public Key
  };
  const OTP_TTL_MS = 10 * 60 * 1000;   // code valid for 10 minutes
  const RESEND_WAIT_S = 60;            // wait between resends
  const MAX_ATTEMPTS = 5;              // wrong tries per code
  const MAX_SENDS_PER_HOUR = 5;        // sends per hour per account

  const $ = id => document.getElementById(id);
  const msg = (t, type = "err") => { $("msg").className = "msg " + type; $("msg").textContent = t; };
  let user = null, timer = null;

  const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const kOtp = () => "gyaan_otp_" + user.uid, kRate = () => "gyaan_otp_rate_" + user.uid;

  function startCooldown(sentAt) {
    clearInterval(timer);
    const btn = $("resend");
    const tick = () => {
      const left = RESEND_WAIT_S - Math.floor((Date.now() - sentAt) / 1000);
      if (left > 0) { btn.disabled = true; btn.textContent = "Resend code in " + left + "s"; }
      else { btn.disabled = false; btn.textContent = "Resend code"; clearInterval(timer); }
    };
    tick(); timer = setInterval(tick, 1000);
  }

  async function sendCode(isResend) {
    if (EMAILJS.publicKey.startsWith("PASTE_")) {
      return msg("EmailJS Public Key is missing. Add it at the top of verify.html.");
    }
    const now = Date.now();
    let rate = read(kRate()) || { start: now, n: 0 };
    if (now - rate.start > 3600000) rate = { start: now, n: 0 };
    if (rate.n >= MAX_SENDS_PER_HOUR) return msg("Too many codes requested. Please try again in an hour.");

    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, "0");
    $("resend").disabled = true;
    try {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id: EMAILJS.serviceId,
          template_id: EMAILJS.templateId,
          user_id: EMAILJS.publicKey,
          template_params: { to_email: user.email, email: user.email, user_email: user.email, to: user.email, reply_to: user.email, otp: code, site_name: (window.__site && window.__site.name) || "Gyaan Hub" }
        })
      });
      if (!res.ok) throw new Error(await res.text());
    } catch (e) {
      $("resend").disabled = false;
      return msg("Could not send the email. " + (e.message || "").slice(0, 120));
    }
    rate.n++; write(kRate(), rate);
    write(kOtp(), { h: await sha(user.uid + ":" + code), exp: now + OTP_TTL_MS, tries: 0, sentAt: now });
    msg((isResend ? "A new code was sent to " : "We sent a 6-digit code to ") + user.email + ".", "ok");
    startCooldown(now);
    $("code").focus();
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const entered = $("code").value.trim();
    const rec = read(kOtp());
    if (!rec) return msg("No active code. Please request a new one.");
    if (Date.now() > rec.exp) return msg("This code has expired. Please resend a new one.");
    if (rec.tries >= MAX_ATTEMPTS) return msg("Too many wrong attempts. Please resend a new code.");
    if (!/^\d{6}$/.test(entered)) return msg("Enter the 6-digit code.");
    if (await sha(user.uid + ":" + entered) === rec.h) {
      markVerified(user);
      localStorage.removeItem(kOtp());
      showConsent();                                   // step 2: confirm Terms + Privacy, then sign in
    } else {
      rec.tries++; write(kOtp(), rec);
      msg("Incorrect code. " + Math.max(MAX_ATTEMPTS - rec.tries, 0) + " attempt(s) left.");
    }
  });

  // keep only digits (handles pasted text like "123 456")
  $("code").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
  $("paste").addEventListener("click", async () => {
    try {
      const t = (await navigator.clipboard.readText()).replace(/\D/g, "").slice(0, 6);
      if (t.length === 6) { $("code").value = t; msg("Code pasted. Tap Verify.", "ok"); }
      else msg("No 6-digit code found in your clipboard. Copy the code from the email first.");
    } catch (e) { msg("Your browser blocked clipboard access. Long-press the code box and choose Paste."); }
  });
  // one-tap link from the email: verify.html?code=123456 fills the box
  const fromLink = new URLSearchParams(location.search).get("code");
  if (fromLink && /^\d{6}$/.test(fromLink)) { $("code").value = fromLink; history.replaceState(null, "", "verify.html"); }

  $("resend").addEventListener("click", () => sendCode(true));

  // ---- step 2: consent (both boxes must be ticked) ----
  const cmsg = t => { $("cmsg").className = "msg err"; $("cmsg").textContent = t; };
  function showConsent() {
    clearInterval(timer);
    $("otp-step").hidden = true;
    $("consent-step").hidden = false;
    $("c-who").textContent = user && user.email ? " as " + user.email : "";
    document.title = "Confirm to continue | Gyaan Hub";
  }
  const bothTicked = () => $("c-terms").checked && $("c-privacy").checked;
  const syncGo = () => { $("c-go").disabled = !bothTicked(); if (bothTicked()) $("cmsg").className = "msg"; };
  $("c-terms").addEventListener("change", syncGo);
  $("c-privacy").addEventListener("change", syncGo);
  $("c-go").addEventListener("click", async () => {
    if (!bothTicked()) return cmsg("Please tick both boxes to continue.");
    $("c-go").disabled = true; $("c-go").textContent = "Please wait...";
    await giveConsent(user);
    location.href = takeNext();
  });
  $("c-out").addEventListener("click", e => { e.preventDefault(); logout(); });
  $("logout").addEventListener("click", e => { e.preventDefault(); logout(); });

  onUser(async u => {
    if (!u) {
      $("sub").textContent = "Please sign in first to verify your email.";
      msg("You are not signed in.");
      $("form").style.display = "none";
      document.querySelector(".alt").innerHTML = '<a href="login.html" class="btn btn-gold btn-block">Go to Sign In</a>';
      return;
    }
    user = u;
    if (isVerified(u)) {                               // already verified (Google / earlier code): only consent can be left
      if (await consentOk(u)) location.href = takeNext(); else showConsent();
      return;
    }
    $("sub").textContent = "Enter the code we emailed to " + u.email;
    const rec = read(kOtp());
    if (rec && Date.now() < rec.exp) {
      msg("A code was already sent to " + u.email + ". Enter it below.", "ok");
      startCooldown(rec.sentAt);
    } else {
      sendCode(false);
    }
  });
</script>
<script type="module" src="layout.js?v=21"></script>
</body>
</html>
